{% extends "base.html" %}

{% block content %}
<div class="dashboard-container">
    <div class="dash-header">
        <h2>Panel</h2>
        <a href="{{ url_for('logout') }}" class="logout-btn">Çıkış</a>
    </div>
    
    <div class="preview-link">
        Senin linkin: <a href="/{{ user.username }}" target="_blank">siteniz.com/{{ user.username }}</a>
    </div>

    <form method="POST" class="edit-form">
        <div class="form-group">
            <label>Görünen İsim</label>
            <input type="text" name="display_name" value="{{ user.display_name }}">
        </div>
        
        <div class="form-group">
            <label>Biyografi (Bio)</label>
            <textarea name="bio">{{ user.bio }}</textarea>
        </div>

        <div class="form-group">
            <label>Arka Plan URL (GIF/Resim)</label>
            <input type="text" name="background_url" value="{{ user.background_url }}">
        </div>

        <div class="form-group">
            <label>Profil Resmi URL</label>
            <input type="text" name="profile_pic_url" value="{{ user.profile_pic_url }}">
        </div>

        <div class="form-group">
            <label>Müzik URL (.mp3 linki)</label>
            <input type="text" name="music_url" value="{{ user.music_url }}" placeholder="https://site.com/sarki.mp3">
        </div>

        <div class="form-group">
            <label>Discord Linki</label>
            <input type="text" name="discord_link" value="{{ user.discord_link }}">
        </div>

        <div class="form-group">
            <label>Instagram Linki</label>
            <input type="text" name="instagram_link" value="{{ user.instagram_link }}">
        </div>

        <button type="submit" class="btn">Güncelle</button>
    </form>
</div>
{% endblock %}
