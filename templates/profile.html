<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>{{ user.display_name }} | Bio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Bu sayfaya özel CSS (Guns.lol stili) */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            color: white;
        }

        #background-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -1;
            background: url('{{ user.background_url }}') no-repeat center center fixed; 
            background-size: cover;
            filter: brightness(0.4);
        }

        /* Click to Enter Overlay */
        #enter-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 1s ease;
        }

        #enter-text {
            font-size: 24px;
            text-shadow: 0 0 10px white;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* Ana Profil Kartı */
        .profile-card {
            display: none; /* Başlangıçta gizli */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            width: 300px;
            animation: fadeIn 2s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -40%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 0 15px white;
            margin-bottom: 20px;
            object-fit: cover;
        }

        .username {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 0 0 10px white;
        }

        .bio {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        .social-icons a {
            color: white;
            font-size: 24px;
            margin: 0 10px;
            text-decoration: none;
            transition: transform 0.2s, text-shadow 0.2s;
        }

        .social-icons a:hover {
            transform: scale(1.2);
            text-shadow: 0 0 15px white;
        }
        
        .views {
            margin-top: 20px;
            font-size: 10px;
            color: #555;
        }
    </style>
</head>
<body>

    <!-- Arka Plan -->
    <div id="background-video"></div>

    <!-- Müzik -->
    <audio id="bg-music" loop>
        <source src="{{ user.music_url }}" type="audio/mpeg">
    </audio>

    <!-- Click to Enter -->
    <div id="enter-overlay" onclick="enterSite()">
        <div id="enter-text">tıkla...</div>
    </div>

    <!-- Profil İçeriği -->
    <div class="profile-card" id="profile-card">
        <img src="{{ user.profile_pic_url }}" alt="Avatar" class="avatar">
        <div class="username">{{ user.display_name }}</div>
        <div class="bio">{{ user.bio }}</div>
        
        <div class="social-icons">
            {% if user.discord_link %}
            <a href="{{ user.discord_link }}" target="_blank"><i class="fab fa-discord"></i></a>
            {% endif %}
            
            {% if user.instagram_link %}
            <a href="{{ user.instagram_link }}" target="_blank"><i class="fab fa-instagram"></i></a>
            {% endif %}
        </div>

        <div class="views">
            <i class="fas fa-eye"></i> {{ user.view_count }}
        </div>
    </div>

    <script>
        function enterSite() {
            var overlay = document.getElementById('enter-overlay');
            var card = document.getElementById('profile-card');
            var music = document.getElementById('bg-music');

            overlay.style.opacity = '0';
            setTimeout(function() {
                overlay.style.display = 'none';
                card.style.display = 'block';
                
                // Müziği oynatmayı dene
                if(music.getAttribute('src') !== "") {
                    music.volume = 0.5;
                    music.play().catch(error => console.log("Müzik oynatılamadı: " + error));
                }
            }, 1000);
        }
    </script>
</body>
</html>
